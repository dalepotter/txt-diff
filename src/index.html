<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Text Diff Checker</title>
</head>

<body>
  <h2>Text Diff Checker</h2>
  <div>
    <textarea id="text1" placeholder="Original text..."></textarea>
    <textarea id="text2" placeholder="Modified text..."></textarea>
  </div>
  <button id="compareBtn">Compare</button>

  <div class="diff-container">
    <div class="diff-column">
      <h3>Original</h3>
      <div id="diffLeft" class="diff-output"></div>
    </div>
    <div class="diff-column">
      <h3>Modified</h3>
      <div id="diffRight" class="diff-output"></div>
    </div>
  </div>
</body>

</html>
